        <h1>Not Connected</h1>
        <p class="description">Sign in to save links from any page.</p>

              <clipPath id="clip1">
                <rect width="32" height="32" fill="white" />
              </clipPath>
            </defs>
          </svg>
        </div>
        <h1>Connected</h1>
        <p class="description">You're all set to save links.</p>
        <button id="disconnectBtn" class="btn-secondary">Disconnect</button>
      </div>

      <!-- Status Message -->
      <div id="statusMessage" class="status" style="display: none">
        <span id="statusText"></span>
      </div>
    </div>

    <!-- Hidden elements for manual config (used by options.ts) -->
    <input type="hidden" id="manualCadieUrl" value="https://cadie.app" />
    <input type="hidden" id="manualApiToken" value="" />
    <button id="manualToggleTokenBtn" style="display: none"></button>
    <span id="manualToggleTokenText" style="display: none"></span>
    <button id="manualSaveBtn" style="display: none"></button>
    <button id="manualTestBtn" style="display: none"></button>
    <a id="openCadieBtn" href="https://cadie.app" style="display: none"></a>
    <button id="testConnectionBtn" style="display: none"></button>
    <p id="connectedEmail" style="display: none"></p>
    <p id="connectedUrl" style="display: none"></p>

    <script src="options.js"></script>
  </body>
</html>
